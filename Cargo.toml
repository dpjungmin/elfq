[package]
name = "elfq"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Query ELF binaries: call graphs, exclusive code and retained size"
license = "MIT"
repository = "https://github.com/dpjungmin/elfq"
exclude = ["/testdata"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpp_demangle = { version = "0.5.1", default-features = false, features = ["std"] }
gimli = { version = "0.34.0", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
rustc-demangle = "0.1.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

# gimli adds a size in DW_AT_high_pc to DW_AT_low_pc without a check. When
# damaged debug info makes the sum overflow, a release build wraps it, and
# elfq drops the range, which then ends before it starts. Debug builds, which
# the tests use, do the same rather than panic.
[profile.dev.package.gimli]
overflow-checks = false
