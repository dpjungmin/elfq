[package]
name = "elfq"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Query ELF binaries: call graphs, exclusive code and retained size"
license = "MIT"
repository = "https://github.com/dpjungmin/elfq"
exclude = ["/testdata"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpp_demangle = { version = "0.5.1", default-features = false, features = ["std"] }
gimli = { version = "0.34.0", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
rustc-demangle = "0.1.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# For `elfq FILE browse`, with the tui feature.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
# Prints Thumb instructions in browse. Pinned, since another version may
# print some instructions differently.
thumb-asm = { version = "=0.14.1", optional = true }

# Ctrl-Z in `elfq FILE browse`: rustix stops elfq's process group, and
# signal-hook says when the shell continues it. crossterm already depends on
# both.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process"], optional = true }
signal-hook = { version = "0.3.18", default-features = false, optional = true }

[features]
default = ["tui"]
# `elfq FILE browse`, which shows code and follows it in the terminal.
# Without it, elfq builds with fewer dependencies, and browse says so.
tui = ["dep:ratatui", "dep:rustix", "dep:signal-hook", "dep:thumb-asm", "iced-x86/intel"]

[lints.rust]
unsafe_code = "forbid"

# Debug builds, which `cargo run` and the tests use, are optimized a little:
# unoptimized, elfq takes five or six times as long on a large file, and the
# tests four times as long. They still check arithmetic for overflow and keep
# all their debug info.
[profile.dev]
opt-level = 1

# gimli adds a size in DW_AT_high_pc to DW_AT_low_pc without a check. When
# damaged debug info makes the sum overflow, a release build wraps it, and
# elfq drops the range, which then ends before it starts. Debug builds, which
# the tests use, do the same rather than panic.
[profile.dev.package.gimli]
overflow-checks = false
