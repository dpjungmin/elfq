name: Release

# Builds elfq for each platform below, tests it there, and packs each build
# with README.md and LICENSE. It then publishes a GitHub release with the
# files, named v and the version in Cargo.toml, such as v0.2.0:
# - when that tag is pushed;
# - or when a run is started by hand on main, from the Actions tab, with
#   Publish ticked. The run then makes the tag, on the commit it built.
# A pull request that changes this file, and a run started by hand without
# Publish, do everything but publish, and keep the files on the run's page
# to try.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release of the version in Cargo.toml (from main only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Named runners, not -latest ones, whose system can change under
          # a release.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-26 }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, exe: .exe }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, exe: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # rustup comes with the runner, so that no action from outside
      # GitHub builds what the release publishes.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked

      # A Linux program needs a glibc at least as new as the one it was
      # linked against, and the runner's is new (2.39 on Ubuntu 24.04).
      # cargo-zigbuild links against glibc 2.17 instead, so that elfq runs
      # on every distro since about 2014. The check below fails if it
      # needs anything newer.
      - name: Build against glibc 2.17
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet cargo-zigbuild==0.24.0 ziglang==0.17.0
          PATH="$RUNNER_TEMP/zig/bin:$PATH" cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17
          newest=$(objdump -T target/${{ matrix.target }}/release/elfq | grep -o 'GLIBC_2\.[0-9.]*' | sort -uV | tail -1)
          echo "elfq needs $newest"
          [ "$(printf '%s\n' "$newest" GLIBC_2.17 | sort -V | tail -1)" = GLIBC_2.17 ]

      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # Puts the C runtime in elfq.exe, so that it runs on a Windows
          # without the Visual C++ Redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}

      - name: Run the build
        run: |
          elfq=target/${{ matrix.target }}/release/elfq${{ matrix.exe }}
          "$elfq" --version
          "$elfq" testdata/bin/c-x86_64.elf top > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: elfq-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/elfq${{ matrix.exe }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Only the builds: a run started again also has the release artifact
      # that an earlier attempt uploaded.
      - uses: actions/download-artifact@v8
        with:
          pattern: elfq-*
          path: builds

      # elfq-x86_64-unknown-linux-gnu.tar.gz holds a folder of that name
      # with elfq, README.md and LICENSE; Windows builds go in a .zip. The
      # names leave out the version, so that a link to the latest release's
      # file, as in README.md, stays the same.
      - name: Pack the builds
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir dist
          for build in builds/*; do
            name=$(basename "$build")
            mkdir "$name"
            cp "$build"/* README.md LICENSE "$name"
            if [ -e "$name/elfq.exe" ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              # Artifacts lose the executable bit.
              chmod +x "$name/elfq"
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist

      - name: Publish the release
        # Pushes start this workflow only for tags.
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # The tag that was pushed, or the branch that a run started on.
          REF: ${{ github.ref_name }}
        run: |
          tag=v$VERSION
          if [ "$EVENT" = push ] && [ "$REF" != "$tag" ]; then
            echo "The tag $REF doesn't match the version in Cargo.toml, $VERSION."
            exit 1
          fi
          if [ "$EVENT" != push ]; then
            if [ "$REF" != main ]; then
              echo "Releases are made from main, not $REF."
              exit 1
            fi
            if git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null; then
              echo "$tag is already tagged. Raise the version in Cargo.toml first."
              exit 1
            fi
          fi
          # Makes the tag on the commit built here, unless it was pushed.
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "elfq $tag" --generate-notes
