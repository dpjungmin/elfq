name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Without the tui feature, which browse needs.
      - run: cargo clippy --all-targets --locked --no-default-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The oldest Rust that elfq supports, as rust-version in Cargo.toml says.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --all-targets --locked
      - run: cargo check --all-targets --locked --no-default-features

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      # browse in a real terminal, which script gives it: q quits with exit
      # status 0, the terminal's settings are as they were (exit status 3
      # if not), and it gets its screen back (ESC[?1049l). If q doesn't
      # quit, timeout stops it.
      - name: browse in a terminal
        if: runner.os == 'Linux'
        run: |
          cargo build --locked
          (sleep 1; printf q) | timeout 60 script -qec 'stty cols 100 rows 30; before=$(stty -g); target/debug/elfq testdata/bin/c-x86_64.elf browse log_msg; status=$?; [ "$(stty -g)" = "$before" ] || status=3; exit $status' /dev/null > browse.out
          grep -qF $'\e[?1049l' browse.out
